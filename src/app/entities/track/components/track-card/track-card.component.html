<app-m3-card variant="outlined" [appTestId]="'track-item-' + track?.id" [hasActions]="true">
  <div class="track-card-select" *ngIf="selectMode">
    <mat-checkbox
      [checked]="selected"
      (change)="onSelect($event)"
      [attr.aria-label]="'Select ' + (track?.title || 'track')"
      [appTestId]="'track-checkbox-' + track?.id">
    </mat-checkbox>
  </div>

  <div class="track-card-image-container">
    <app-optimized-image 
      [src]="imageSource" 
      [alt]="track?.title || 'Track cover'"
      [width]="300"
      [height]="300"
      [priority]="isPriority">
    </app-optimized-image>
    
    <div class="track-card-cover">
      <app-m3-button
        *ngIf="hasAudioFile"
        variant="filled"
        size="small"
        [class]="'play-button' + (isCurrentlyPlaying ? ' playing' : '')"
        (clicked)="onPlay()"
        [testId]="isCurrentlyPlaying ? 'pause-button-' + track?.id : 'play-button-' + track?.id">
        {{ isCurrentlyPlaying ? '⏸' : '▶' }}
      </app-m3-button>
    </div>
  </div>

  <div class="track-card-content">
    <h2 class="track-title" [appTestId]="'track-item-' + track?.id + '-title'">{{ track?.title }}</h2>
    <p class="track-artist" [appTestId]="'track-item-' + track?.id + '-artist'">{{ track?.artist }}</p>
    <p class="track-album" *ngIf="track?.album">{{ track?.album }}</p>

    <div class="track-genres" *ngIf="track?.genres && !!track?.genres?.length">
      <mat-chip-set>
        <mat-chip *ngFor="let genre of track?.genres; trackBy: trackByGenre">{{ genre }}</mat-chip>
      </mat-chip-set>
    </div>
  </div>

  <div slot="actions">
    <app-m3-button
      variant="text"
      size="small"
      (clicked)="onEdit()"
      [testId]="'edit-track-' + track?.id">
      Edit
    </app-m3-button>

    <app-m3-button
      variant="text"
      size="small"
      (clicked)="onUpload()"
      [testId]="'upload-track-' + track?.id">
      Upload
    </app-m3-button>

    <app-m3-button
      variant="text"
      size="small"
      (clicked)="onDelete()"
      [testId]="'delete-track-' + track?.id">
      Delete
    </app-m3-button>
  </div>
</app-m3-card>
