<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Music Tracks App</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Music Tracks Application - Manage and play your music collection">
    <meta name="theme-color" content="#1976d2">
    
    <!-- Preconnect and DNS prefetch for critical resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">

    
    <!-- Preload critical images -->
    <link rel="preload" href="/images/default-cover.png" as="image" type="image/png">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="preload"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
        rel="stylesheet"
      />
    </noscript>
    
    <link 
      href="https://fonts.googleapis.com/icon?family=Material+Icons" 
      rel="preload"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    </noscript>
  </head>
  <body class="mat-typography">
    <app-root></app-root>
    <noscript>Please enable JavaScript to run this application.</noscript>
  </body>
</html>
