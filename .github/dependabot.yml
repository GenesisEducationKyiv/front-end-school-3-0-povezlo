version: 2
updates:
  # Frontend dependencies (for GenesisEducationKyiv/front-end-school-3-0-povezlo)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    target-branch: "develop"
    reviewers:
      - "alies"
    labels:
      - "dependencies"
      - "frontend"
      - "automation"
    commit-message:
      prefix: "feat"
      include: "scope"
    # Ignore major version updates for critical dependencies
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # Group related updates
    groups:
      angular:
        patterns:
          - "@angular/*"
        update-types:
          - "minor"
          - "patch"
      testing:
        patterns:
          - "@playwright/*"
          - "@types/*"
          - "jest"
          - "vitest"
        update-types:
          - "minor"
          - "patch"
      linting:
        patterns:
          - "eslint*"
          - "prettier"
          - "@typescript-eslint/*"
        update-types:
          - "minor"
          - "patch"

