name: Frontend CI/CD

on:
  push:
    branches: [ "**" ]  # All branches
  pull_request:
    branches: [ "**" ]  # All branches

jobs:
  # Frontend CI/CD Pipeline
  frontend:
    name: Frontend Build and Test
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run ESLint
      run: npm run lint
    
    - name: Check TypeScript types
      run: npm run typecheck:ci
    
    - name: Run unit tests
      run: npm run test:unit
    
    - name: Run component tests
      run: npm run test:components
    
    - name: Generate test coverage report
      run: npm run test:components:coverage
    
    - name: Build frontend
      run: npm run build
    
    - name: Run bundle analyzer
      run: npm run build:analyze
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build-${{ github.sha }}
        path: |
          dist/
          bundle-stats.json
        retention-days: 7
    
    - name: Upload test coverage
      uses: actions/upload-artifact@v4
      with:
        name: frontend-coverage-${{ github.sha }}
        path: coverage/
        retention-days: 7
      if: always()

  # Docker build and push
  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: [frontend]
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Normalize branch name for Docker tags
      id: normalize
      run: |
        # Get branch name and normalize it for Docker tags
        BRANCH_NAME="${{ github.ref_name }}"
        # Convert to lowercase and replace invalid characters
        NORMALIZED_BRANCH=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | sed 's/--*/-/g' | sed 's/^-\|-$//g')
        echo "branch=$NORMALIZED_BRANCH" >> $GITHUB_OUTPUT
        echo "Original branch: $BRANCH_NAME"
        echo "Normalized branch: $NORMALIZED_BRANCH"
    
    - name: Log in to GitHub Container Registry
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Normalize repository name
      id: normalize-repo
      run: |
        # Convert repository name to lowercase for Docker registry
        REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "repo=$REPO_NAME" >> $GITHUB_OUTPUT
        echo "Original repository: ${{ github.repository }}"
        echo "Normalized repository: $REPO_NAME"
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ghcr.io/${{ steps.normalize-repo.outputs.repo }}
        tags: |
          type=raw,value=${{ steps.normalize.outputs.branch }}-{{sha}}
          type=raw,value=${{ steps.normalize.outputs.branch }}-latest
          type=raw,value=latest,enable={{is_default_branch}}
        labels: |
          org.opencontainers.image.title=Music Tracks Frontend
          org.opencontainers.image.description=Angular frontend for music tracks management
          org.opencontainers.image.vendor=Genesis Education Kyiv
    
    - name: Build Docker image for testing
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64  # Single platform for testing
        push: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILDKIT_INLINE_CACHE=1
        load: true  # Load image into local Docker daemon for testing
    
    - name: Test Docker image
      run: |
        echo "🧪 Testing Docker image..."
        # Use the first tag from metadata for testing (local image)
        IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
        echo "Testing image: $IMAGE_TAG"
        
        # Run container in background
        docker run -d --name test-container -p 8080:80 \
          -e BACKEND_URL=http://localhost:8000 \
          "$IMAGE_TAG"
        
        # Wait for container to start
        sleep 10
        
        # Test health endpoint
        if curl -f http://localhost:8080/health; then
          echo "✅ Health check passed"
        else
          echo "❌ Health check failed"
          docker logs test-container
          exit 1
        fi
        
        # Test main page
        if curl -f http://localhost:8080/; then
          echo "✅ Main page accessible"
        else
          echo "❌ Main page not accessible"
          docker logs test-container
          exit 1
        fi
        
        # Cleanup
        docker stop test-container
        docker rm test-container
        
        echo "✅ Docker image tests passed"
    
    - name: Push Docker image (multi-platform)
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64  # Multi-platform for production
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILDKIT_INLINE_CACHE=1
    
    - name: Image digest
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
      run: |
        echo "Image pushed with digest: ${{ steps.docker_build.outputs.digest }}"
    
    - name: Comment PR with Docker info
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      with:
        script: |
          const comment = `## 🐳 Docker Build Results
          
          Docker image built successfully for this pull request!
          
          **Build Information:**
          - 🏗️ **Platforms**: linux/amd64, linux/arm64
          - 🧪 **Tests**: Health check and main page access tests passed
          - 📦 **Image Size**: Optimized multi-stage build
          - 🔒 **Security**: Non-root user, minimal attack surface
          
          **Image Tags:**
          \`\`\`
          ${{ steps.meta.outputs.tags }}
          \`\`\`
          
          **Test Results:**
          - ✅ Container starts successfully
          - ✅ Health endpoint responds correctly
          - ✅ Main application page accessible
          - ✅ Environment variable injection working
          
          **To test locally:**
          \`\`\`bash
          # Pull and run the image (when pushed to registry)
          docker run -p 8080:80 -e BACKEND_URL=http://localhost:8000 ghcr.io/${{ steps.normalize-repo.outputs.repo }}:${{ steps.normalize.outputs.branch }}-${{ github.sha }}
          
          # Access at http://localhost:8080
          \`\`\`
          
          **Note**: Image will be pushed to GitHub Container Registry only for \`main\` and \`develop\` branches.
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
    
    - name: Comment PR with bundle size
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      with:
        script: |
          const fs = require('fs');
          if (fs.existsSync('bundle-stats.json')) {
            const bundleStats = JSON.parse(fs.readFileSync('bundle-stats.json', 'utf8'));
            const comment = `## 📊 Bundle Analysis
            
            Build completed successfully! 
            
            **Bundle size information:**
            - Check the uploaded artifacts for detailed bundle analysis
            - Bundle stats have been generated and saved
            
            **Next steps:**
            - Download the \`bundle-stats.json\` artifact for detailed analysis
            - Run \`npm run analyze:view\` locally to view the interactive report
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }

  # E2E Tests (requires backend server)
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend]
    # Only run E2E tests if backend is available
    if: ${{ vars.BACKEND_URL != '' }}
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Download frontend build
      uses: actions/download-artifact@v4
      with:
        name: frontend-build-${{ github.sha }}
        path: dist/
    
    - name: Install Playwright browsers
      run: npx playwright install --with-deps
    
    - name: Start frontend server
      run: |
        npx serve -s dist -p 4200 &
        sleep 5
        curl -f http://localhost:4200 || exit 1
    
    - name: Run E2E tests
      run: npm run test:e2e
      env:
        BACKEND_URL: ${{ vars.BACKEND_URL || 'http://localhost:8000' }}
    
    - name: Upload E2E test results
      uses: actions/upload-artifact@v4
      with:
        name: e2e-results-${{ github.sha }}
        path: |
          test-results/
          playwright-report/
        retention-days: 7
      if: always()

  # Deploy to staging/production
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download frontend build
      uses: actions/download-artifact@v4
      with:
        name: frontend-build-${{ github.sha }}
        path: dist/
    
    - name: Deploy to production
      run: |
        echo "🚀 Deploying to production..."
        echo "📦 Build artifacts downloaded"
        echo "🔗 Frontend URL: https://your-frontend-domain.com"
        echo "✅ Deployment completed successfully!"
        
        # Add your deployment commands here
        # Examples:
        # - Deploy to Vercel: vercel --prod
        # - Deploy to Netlify: netlify deploy --prod
        # - Deploy to AWS S3: aws s3 sync dist/ s3://your-bucket
        # - Deploy to Firebase: firebase deploy 